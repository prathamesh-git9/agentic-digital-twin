services:
  - type: web
    name: prathamesh-digital-twin-api
    runtime: python
    plan: free
    autoDeploy: true
    buildCommand: pip install -e .
    startCommand: uvicorn digital_twin.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/health
    envVars:
      - key: TWIN_ENVIRONMENT
        value: production
      - key: TWIN_DATABASE_URL
        value: sqlite:////tmp/digital-twin.db
      - key: TWIN_PUBLIC_BASE_URL
        value: https://prathamesh-digital-twin-api.onrender.com
      - key: TWIN_PROVIDER
        value: openai-compatible
      - key: TWIN_LLM_BASE_URL
        value: https://api.openai.com/v1
      - key: TWIN_LLM_MODEL
        value: gpt-5.6-sol
      - key: TWIN_LLM_API_KEY
        sync: false
      - key: TWIN_HASH_SECRET
        generateValue: true
      - key: TWIN_SEARCH_PROVIDER
        value: duckduckgo
      - key: TWIN_TOOL_TIMEOUT_SECONDS
        value: "25"
      - key: TWIN_TOOL_WALL_CLOCK_SECONDS
        value: "25"
      - key: TWIN_MAX_SESSIONS_PER_IP_HOUR
        value: "300"
      - key: TWIN_REQUESTS_PER_MINUTE
        value: "120"
      - key: TWIN_AUTOSEND
        value: "false"
      - key: TWIN_LINKEDIN_AUTO
        value: "false"
