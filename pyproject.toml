[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "prathamesh-digital-twin"
version = "0.1.0"
description = "A recruiter-facing, source-grounded AI twin with an authority-gated research context"
readme = "README.md"
requires-python = ">=3.11"
license = { file = "LICENSE" }
authors = [{ name = "Prathamesh Kalamkar" }]
dependencies = [
  "dnspython>=2.7,<3",
  "email-validator>=2.2,<3",
  "fastapi>=0.115,<1",
  "httpx>=0.27,<1",
  "pydantic-settings>=2.6,<3",
  "PyYAML>=6.0,<7",
  "scrapling>=0.3,<1",
  "selectolax>=0.3,<1",
  "sqlalchemy>=2.0,<3",
  "tldextract>=5.1,<6",
  "trafilatura>=2.0,<3",
  "uvicorn[standard]>=0.32,<1",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3,<9",
  "pytest-asyncio>=0.25,<1",
  "pytest-socket>=0.7,<1",
  "ruff>=0.9,<1",
]
linkedin = [
  "playwright>=1.50,<2",
]

[project.scripts]
digital-twin = "digital_twin.main:run"
digital-twin-smtp-check = "digital_twin.smtp_check:main"

[tool.hatch.build.targets.wheel]
packages = ["src/digital_twin"]

[tool.pytest.ini_options]
addopts = "-ra --disable-socket --allow-hosts=127.0.0.1,localhost"
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.ruff]
line-length = 90
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC", "S"]
ignore = ["S101"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S105", "S106"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
