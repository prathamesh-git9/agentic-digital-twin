# Labelled claims for the grounding verifier.
#
# The verifier is what stands between a fluent model and a recruiter reading
# something Prathamesh never did. It had never been measured.
#
# `accept: true` means the claim is genuinely supported by its evidence and
# dropping it would make the twin refuse a question it can answer. `accept:
# false` means the claim asserts something the evidence does not, and accepting
# it would put a fabrication in front of a hiring manager.
#
# The two failure directions are not equally bad. A false rejection costs a
# refusal on an answerable question. A false acceptance claims he worked at
# Google. The thresholds are chosen accordingly.
schema_version: 1
evidence:
  auth: >-
    Refactored nearly 50% of a legacy authentication module, reducing duplicated
    logic and improving flow design so changes became easier to test, review, and
    extend safely.
  debugging: >-
    Investigated complex failures by tracing execution paths, isolating edge cases,
    and rewriting unclear components into smaller modules, improving debugging speed
    and service stability by about 30%.
  ai_skills: >-
    LLM integrations, OpenAI APIs, Claude integrations, agentic workflows, function
    calling, tool orchestration, retries, guardrails, prompt contracts, MCP
    familiarity, model serving patterns.
  event_skills: >-
    event driven pipelines, Kafka familiarity, SQS familiarity, context assembly,
    RAG concepts, embeddings familiarity, vector store familiarity, caching and
    rate-limiting concepts.
  freelance: >-
    Built LLM-powered back-end services in Python and Java-adjacent service patterns
    for agentic workflows, including tool orchestration, structured outputs, retries,
    validation, and safety checks.
  backend: >-
    Built and maintained back-end applications using Java, Spring Boot, Python, SQL,
    and REST APIs, contributing to new features, bug fixes, and service improvements
    across shared production systems.
  regressions: >-
    Added diagnostics, health checks, and regression-focused checks around shared
    services, reducing regressions by about 35% and improving visibility into
    abnormal behavior.
  education: >-
    MSc in Cybersecurity, 1:1 Class Honours, Sep 2024 to Sep 2025. Coursework:
    Software Engineering, Database Systems, Distributed Systems, Network Security,
    Software Security.
  safecode: >-
    Built an AI-assisted code review tool that analyzed source code for
    vulnerabilities and returned structured findings for triage and follow-up.
  contact: >-
    Prathamesh Kalamkar is based in Dublin, Ireland and can be contacted at
    prathemesh7744@gmail.com.

